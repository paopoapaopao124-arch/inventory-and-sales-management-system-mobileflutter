
name: stocksmart
description: StockSmart Inventory and Sales Management System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.2
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.3.2
  image_picker: ^1.2.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/stocksmart_app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/stocksmart_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#083F3A"
  adaptive_icon_foreground: "assets/icons/stocksmart_app_icon.png"
  remove_alpha_ios: true
